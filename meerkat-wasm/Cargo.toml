[package]
name = "meerkat-wasm"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meerkat-lib = { path = "../meerkat-lib" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# 0.3, not 0.4: gloo-timers 0.4 needs js-sys >= 0.3.91, but libp2p-swarm 0.48.0
# pins wasm-bindgen-futures =0.4.58, which pins js-sys 0.3.85. Go back to 0.4
# once libp2p-swarm relaxes that pin.
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Document", "Window", "Element", "HtmlElement"] }
petgraph = "0.8.3"
